# BRANCH OVERRIDE — fix/simplicity-free-tier-api-key-confusion-mac-win only.
#
# The real windows-installer workflow lives on `desktop` and is untouched there.
# It is borrowed here purely as a dispatch vehicle: GitHub will only start a
# `workflow_dispatch` run for a workflow FILE THAT EXISTS ON THE DEFAULT BRANCH
# (`gh workflow run bugfix-lab.yml --ref <branch>` answers
# "HTTP 404: workflow bugfix-lab.yml not found on the default branch"), and
# adding a lab workflow to `desktop` is not this pipeline's to do. Dispatching
# this filename with --ref <this branch> runs the content below, from this
# branch, on a windows-latest runner, and changes nothing on `desktop`.
#
# Identical in substance to .github/workflows/bugfix-lab.yml in this same
# commit, which is the canonical copy.
name: windows-installer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Repro — simplicity-free-tier-api-key-confusion-mac-win
        shell: pwsh
        run: ./scripts/bugfix-lab/simplicity-free-tier-api-key-confusion-mac-win.ps1

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bugfix-lab-evidence
          path: |
            install-stream.ndjson
            dev.log
          if-no-files-found: warn
