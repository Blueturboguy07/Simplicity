name: bugfix-lab

# Controlled Windows environment for the bugfix-lab pipeline (there is no local
# Windows). Runs the cluster's repro script on a clean windows-latest runner.
on:
  workflow_dispatch:

jobs:
  repro:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Repro — simplicity-free-tier-api-key-confusion-mac-win
        shell: pwsh
        run: ./scripts/bugfix-lab/simplicity-free-tier-api-key-confusion-mac-win.ps1

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bugfix-lab-evidence
          path: |
            install-stream.ndjson
            dev.log
          if-no-files-found: warn
